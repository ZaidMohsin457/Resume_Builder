<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Listings</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="navbar-content">
      <div class="logo">Logo</div>
      <div class="navbar-right">
        <button class="primary-button">Login</button>
      </div>
    </div>
  </header>

  <div class="jobs-container">
    <div class="resume-sidebar">
      <div class="resume-info">
        <h3>Uploaded Resume</h3>
        <p id="resumeName"></p>
        <button class="secondary-button">Remove Resume</button>
        <button class="secondary-button">Upload New</button>
      </div>
    </div>

    <div class="job-listings">
      <h2>Found 15 Relevant Jobs</h2>
      <div class="job-cards-container">
        <div class="job-card">
          <div class="job-header">
            <h3>Senior Product Designer</h3>
            <button class="select-button" onclick="window.location.href='analysis.html'">Select & Analyze</button>
          </div>
          <div class="job-details">
            <span class="company">Tech Corp Inc.</span>
            <span class="location">New York, NY</span>
            <span class="source">Glassdoor</span>
          </div>
          <p class="job-snippet">Looking for experienced product designer with 5+ years experience in UX/UI design...</p>
        </div>
      </div>
    </div>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
