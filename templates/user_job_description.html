<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enter Job Description</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="navbar-content">
      <div class="logo">Logo</div>
      <div class="navbar-right">
        <button class="primary-button">Login</button>
      </div>
    </div>
  </header>

  <main class="job-description-container">
    <h1>Enter Job Description</h1>
    <form method="POST" action="{% url 'user_job_description' %}">
      {% csrf_token %}
      <input type="hidden" name="analysis_id" id="analysis_id">
      <textarea name="job_description" placeholder="Paste the job description here..." required></textarea>
      <button type="submit" class="primary-button">Analyze Resume</button>
    </form>
  </main>

  <script>
    // Get the analysis_id from localStorage and set it in the form
    document.addEventListener('DOMContentLoaded', function() {
      const analysisId = localStorage.getItem('currentAnalysisId');
      if (analysisId) {
        document.getElementById('analysis_id').value = analysisId;
      }
    });
  </script>
</body>
</html>
